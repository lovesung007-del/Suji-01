<div class="panel"><h2>수지가 보이는지부터 확인해</h2><p>이 화면은 먼저 얼굴과 버튼을 실행하고, 3D 기능을 별도로 시험해. 3D가 실패해도 얼굴은 사라지지 않아.</p>
<div class="controls"><button class="primary" id="talk">▶ “오빠, 나 여기 있어” 말하기</button><button id="turn">↔ 고개 좌우</button><button id="blink">👀 눈 깜빡임</button><button id="smile">😊 환한 웃음</button><button id="surprise">😮 놀람</button><button id="neutral">🙂 기본 표정</button><button id="mesh">◈ 3D 표면 점검</button></div>
<div class="line"><label>고개 방향 <output id="yawValue">0°</output></label><input type="range" min="-16" max="16" value="0" id="yaw"></div>
<div class="line"><label>입술·턱 움직임 <output id="mouthValue">0%</output></label><input type="range" min="0" max="100" value="0" id="mouth"></div>
<div id="status" role="status" aria-live="polite">수지 얼굴을 준비하는 중...</div>
<div class="foot">이것은 3D 구조 가능성을 확인하는 기술 시범판이야. 완성된 실사형 3D 아바타가 아니며, 음성에 맞춘 정밀 립싱크나 실제 얼굴 추적은 아직 없어. 그래픽 기능이 실패하면 사진 안전 모드로 전환돼.</div>
</div></div>
<script>
(function(){'use strict';
const $=id=>document.getElementById(id), face=$('face'),canvas=$('gl'),status=$('status'),mode=$('mode');
let gl=null, program=null, meshReady=false, speechActive=false, sweeping=false, lastFrame=0;
let targetYaw=0, yaw=0, mouth=0, targetMouth=0, smile=0, surprise=0, blinking=0, meshShow=false;
function message(s){status.textContent=s;}
function safeMode(reason){meshReady=false;canvas.style.display='none';face.style.display='block';mode.textContent='기본 사진 안전 모드'; message('수지는 정상 표시 중. '+reason+'\n음성 버튼과 고개 방향 조절은 계속 시험할 수 있어. 입술·턱의 입체 변형은 이 모드에서 비활성화돼.');}
// Controls and speech are installed BEFORE trying any 3D initialization.
const phrase='오빠, 나 여기 있어. 오늘도 반가워!';
function stopSpeech(){speechActive=false;targetMouth=0;$('talk').textContent='▶ “오빠, 나 여기 있어” 말하기';}
$('talk').onclick=function(){
 if(speechActive){if(window.speechSynthesis)window.speechSynthesis.cancel();stopSpeech();return;}
 if(!window.speechSynthesis || !window.SpeechSynthesisUtterance){message('이 브라우저에는 한국어 음성 읽어주기 기능이 없어.');return;}
 speechActive=true;targetMouth=.48;$('talk').textContent='■ 말하기 중지';message('한국어 음성 테스트를 시작했어. 기기에서 소리가 나는지 확인해 줘.');
 try {const ss=window.speechSynthesis;ss.cancel();const u=new SpeechSynthesisUtterance(phrase);u.lang='ko-KR';u.rate=.88;u.pitch=1.05;
 const voice=ss.getVoices().find(v=>v.lang.toLowerCase().startsWith('ko'));if(voice)u.voice=voice;
 u.onend=()=>{stopSpeech();message('말하기 완료. 다시 눌러 시험할 수 있어.')};
 u.onerror=e=>{stopSpeech();message('기기 음성 재생 실패 ('+(e.error||'원인 미상')+'). 태블릿의 음성 엔진과 소리 설정을 확인해 줘.')};
 ss.speak(u);setTimeout(()=>{if(speechActive){stopSpeech();message('음성 응답 시간이 초과됐어. 브라우저의 한국어 음성 기능을 확인해 줘.');}},9000);
 } catch(e){stopSpeech();message('음성 버튼 오류: '+e.message);}
};
$('turn').onclick=()=>{sweeping=!sweeping;message(sweeping?'고개 좌우 테스트 중':'고개 움직임 중지');};
$('blink').onclick=()=>{blinking=1;message(meshReady?'눈 깜빡임 시험':'사진 안전 모드: 눈 깜빡임은 아직 지원되지 않아.');};
$('smile').onclick=()=>{smile=1;surprise=0;message(meshReady?'웃음 변형 시험':'사진 안전 모드: 웃음은 3D 기능이 작동해야 움직여.');};
$('surprise').onclick=()=>{surprise=1;smile=0;message(meshReady?'놀람 변형 시험':'사진 안전 모드: 놀람은 3D 기능이 작동해야 움직여.');};
$('neutral').onclick=()=>{smile=0;surprise=0;targetMouth=0;targetYaw=0;sweeping=false;message('기본 표정으로 돌아왔어.');};
$('mesh').onclick=()=>{meshShow=!meshShow;message(meshReady?'3D 표면 '+(meshShow?'점 표시':'일반 표시'):'3D 그래픽이 준비되지 않아 구조를 그릴 수 없어. 사진은 정상 표시 중이야.');};
$('yaw').oninput=e=>{sweeping=false;targetYaw=+e.target.value*Math.PI/180;$('yawValue').textContent=e.target.value+'°';if(!meshReady)message('사진 안전 모드에서는 고개를 약하게 기울이는 효과만 확인할 수 있어.');};
$('mouth').oninput=e=>{targetMouth=+e.target.value/100;$('mouthValue').textContent=e.target.value+'%';message(meshReady?'3D 입술·턱 반응 시험 중':'사진 안전 모드에서는 입술·턱 애니메이션을 표시하지 않아.');};
// Render the reference portrait regardless of GPU support.
face.onload=()=>{if(!meshReady&&!mode.textContent.includes('안전 모드'))mode.textContent='수지 얼굴 표시 완료 · 3D 점검 중';};
face.onerror=()=>message('기본 사진 표시가 실패했어. 이미지 데이터 확인이 필요해.');
if(face.complete&&face.naturalWidth)mode.textContent='수지 얼굴 표시 완료 · 3D 점검 중';
try{gl=canvas.getContext('webgl',{alpha:true,antialias:false,preserveDrawingBuffer:false,failIfMajorPerformanceCaveat:true});}catch(e){}
if(!gl){safeMode('WebGL 시작 불가');startLoop();return;}
function shader(type,source){let sh=gl.createShader(type);gl.shaderSource(sh,source);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(sh)||'셰이더 컴파일 실패');return sh;}
const VS=`precision mediump float;attribute vec2 aPos;uniform float uYaw; uniform float uMouth; varying vec2 vUV; void main(){vec2 uv=aPos; float xx=(uv.x-.5)*2.0;float yy=(.5-uv.y)*2.0;float dz=0.12*exp(-pow((uv.x-.5)/.27,2.0)-pow((uv.y-.32)/.26,2.0)); float head=(1.0-smoothstep(.42,.59,uv.y))*(1.0-smoothstep(.28,.48,abs(uv.x-.5)));float a=uYaw*head;float x=xx*cos(a)+dz*sin(a); float z=dz*cos(a)-xx*sin(a);float lip=exp(-pow((uv.x-.51)/.11,2.0)-pow((uv.y-.40)/.055,2.0));yy-=uMouth*.018*lip;gl_Position=vec4(x,yy,z*.12,1.0);vUV=vec2(uv.x,1.0-uv.y);}`;
const FS=`precision mediump float;uniform sampler2D uTex;uniform float uMouth;uniform float uBlink;uniform float uSmile;uniform float uSurprise;varying vec2 vUV; void main(){vec2 uv=vec2(vUV.x,1.0-vUV.y);vec4 c=texture2D(uTex,vUV);float d=length((uv-vec2(.51,.40))/vec2(.085,.006+uMouth*.018+uSurprise*.007));float a=(1.0-smoothstep(.76,1.0,d))*clamp(uMouth+uSurprise,0.0,1.0);c.rgb=mix(c.rgb,vec3(.28,.09,.13),a*.64);gl_FragColor=c;}`;
try{
 const p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,VS));gl.attachShader(p,shader(gl.FRAGMENT_SHADER,FS));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p)||'프로그램 링크 실패');program=p;
 const nx=46,ny=70,v=[],ind=[];for(let j=0;j<=ny;j++)for(let i=0;i<=nx;i++)v.push(i/nx,j/ny);
 for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){const a=j*(nx+1)+i,b=a+1,c=a+nx+1,d=c+1;ind.push(a,c,b,b,c,d);}
 const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(v),gl.STATIC_DRAW);
 const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(ind),gl.STATIC_DRAW);
 gl.useProgram(p);const at=gl.getAttribLocation(p,'aPos');gl.enableVertexAttribArray(at);gl.vertexAttribPointer(at,2,gl.FLOAT,false,0,0);
 const tex=gl.createTexture();gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
 const U={};['uYaw','uMouth','uBlink','uSmile','uSurprise'].forEach(k=>U[k]=gl.getUniformLocation(p,k));gl.uniform1i(gl.getUniformLocation(p,'uTex'),0);
 function paint(ts){if(!meshReady)return;try{gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);gl.uniform1f(U.uYaw,yaw);gl.uniform1f(U.uMouth,mouth);gl.uniform1f(U.uBlink,blinking);gl.uniform1f(U.uSmile,smile);gl.uniform1f(U.uSurprise,surprise);gl.drawElements(gl.TRIANGLES,ind.length,gl.UNSIGNED_SHORT,0);if(gl.getError()!==gl.NO_ERROR)throw new Error('WebGL 그리기 오류');}catch(e){safeMode(e.message);}}
 function activate(){try{if(!face.naturalWidth)throw new Error('얼굴 이미지 데이터 없음');gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,face);if(gl.getError()!==gl.NO_ERROR)throw new Error('얼굴 텍스처 오류');meshReady=true;paint(0);if(!meshReady)return;canvas.style.display='block';mode.textContent='3D 표면 시범 작동 중';message('3D 표면이 표시됐어. 버튼과 음성을 차례로 시험해 줘.');}catch(e){safeMode(e.message);}}
 if(face.complete&&face.naturalWidth)activate();else face.addEventListener('load',activate,{once:true});
 canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();safeMode('3D 연결이 끊김');});
 function frame(t){if(sweeping)targetYaw=Math.sin(t*.0015)*.19; yaw+=(targetYaw-yaw)*.08;mouth+=(targetMouth-mouth)*.18;if(blinking>0)blinking=Math.max(0,blinking-.065);if(meshReady)paint(t);else face.style.transform='perspective(780px) rotateY('+(yaw*180/Math.PI*.4).toFixed(2)+'deg)';requestAnimationFrame(frame);}requestAnimationFrame(frame);
}catch(e){safeMode('3D 초기화 오류: '+e.message);startLoop();}
function startLoop(){function loop(t){if(sweeping)targetYaw=Math.sin(t*.0015)*.19;yaw+=(targetYaw-yaw)*.1;face.style.transform='perspective(780px) rotateY('+(yaw*180/Math.PI*.4).toFixed(2)+'deg)';requestAnimationFrame(loop);}requestAnimationFrame(loop);}
})();
</script></body></html>
